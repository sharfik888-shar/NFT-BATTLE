<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFT BATTLE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Russo One', sans-serif; }
:root {
  --bg: #0a0a0a;
  --card-bg: #1a1a1a;
  --accent-red: #ff3333;
  --accent-white: #ffffff;
  --text-grey: #888888;
  --border-color: #333333;
}
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 50% 0%, #2a0a0a 0%, var(--bg) 70%);
  color: #fff;
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 90px;
  overflow-x: hidden;
}

/* ЭКРАН ЗАГРУЗКИ */
#splash-screen {
  position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  transition: opacity 0.5s ease; opacity: 1;
}
#splash-screen.hidden { opacity: 0; pointer-events: none; }
.splash-title { font-size: 32px; letter-spacing: 4px; color: var(--accent-white); margin-bottom: 20px; animation: pulse 2s infinite; }
.splash-credits { font-size: 14px; color: var(--text-grey); text-align: center; line-height: 1.5; }
.splash-credits span { color: var(--accent-red); }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.app { max-width: 600px; margin: 0 auto; }

/* Шапка */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.topbar h1 { font-size: 22px; letter-spacing: 2px; color: var(--accent-white); }
.stats { display: flex; gap: 8px; }
.stat { background: #111; padding: 8px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); color: var(--accent-white); }
.stat svg { width: 16px; height: 16px; fill: var(--accent-red); }

/* Заголовки и кнопки */
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-title { font-size: 16px; color: var(--accent-white); }
.btn-primary {
  width: 100%; max-width: 280px; padding: 16px; font-size: 16px; border: none; border-radius: 12px;
  background: var(--accent-red); color: #fff; cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3); text-transform: uppercase; font-weight: bold; transition: all 0.2s;
}
.btn-primary:active:not(:disabled) { transform: scale(0.96); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); box-shadow: none; }
.btn-red { background: #fff; color: var(--accent-red); border: 1px solid var(--accent-red); }
.btn-mini { padding: 8px 12px; font-size: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: #fff; background: #222; }

/* Кейсы */
.cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.case-card {
  background: var(--card-bg); border-radius: 16px; padding: 12px; text-align: center;
  border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s;
  display: flex; flex-direction: column; align-items: center; position: relative;
}
.case-card:active { transform: scale(0.95); }
.case-img-container { width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; margin-bottom: 8px; background: transparent; position: relative; }
.case-img { max-width: 90%; max-height: 90%; object-fit: contain; transition: transform 0.2s; }
.case-card:hover .case-img { transform: scale(1.05); }
.case-title { font-size: 14px; color: var(--accent-white); margin-bottom: 4px; }
.case-price { font-size: 12px; color: var(--accent-red); background: #111; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); }

/* Кнопка "?" на кейсе */
.info-btn {
  position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
  background: #111; border-radius: 50%; color: var(--accent-red);
  font-size: 12px; display: flex; justify-content: center; align-items: center;
  cursor: pointer; z-index: 5; border: 1px solid var(--accent-red); transition: 0.2s;
}

/* МОДАЛКА КЕЙСА (МАГАЗИН) */
.case-modal-card {
  background: var(--card-bg); border-radius: 20px; padding: 24px; text-align: center;
  max-width: 340px; width: 100%; border: 1px solid var(--border-color);
  box-shadow: 0 20px 50px rgba(0,0,0,0.8); animation: pop 0.3s; position: relative;
}
.case-modal-img { width: 180px; height: 180px; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; }
.case-modal-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.case-modal-title { font-size: 24px; color: var(--accent-white); margin-bottom: 8px; }
.case-modal-desc { font-size: 12px; color: var(--text-grey); margin-bottom: 20px; }

/* Выбор количества */
.modal-multi-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
.modal-multi-btn {
  background: #000; border: 1px solid var(--border-color); color: var(--text-grey);
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
}
.modal-multi-btn.active { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
.case-modal-buy-btn {
  width: 100%; padding: 16px; font-size: 18px; border: none; border-radius: 12px;
  background: var(--accent-red); color: #fff; cursor: pointer; text-transform: uppercase; font-weight: bold; margin-bottom: 10px;
}

/* АНИМАЦИЯ КЕЙСА */
.open-animation-area { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 95; pointer-events: none; }
.open-animation-area.active { display: flex; }
.cs-case { width: 150px; height: 150px; position: absolute; top: -200px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9)); animation: dropAndShake 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes dropAndShake {
  0% { top: -200px; transform: rotate(0deg) scale(1); }
  50% { top: 50%; transform: translateY(-50%) scale(1.2); }
  60% { top: 50%; transform: translateY(-50%) rotate(-15deg) scale(1.2); }
  70% { top: 50%; transform: translateY(-50%) rotate(15deg) scale(1.2); }
  80% { top: 50%; transform: translateY(-50%) rotate(-10deg) scale(1.2); }
  90% { top: 50%; transform: translateY(-50%) rotate(10deg) scale(1.2); }
  100% { top: 50%; transform: translateY(-50%) rotate(0deg) scale(2); opacity: 0; }
}

/* РУЛЕТКА */
.roulette-wrapper { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 600px; height: 140px; z-index: 96; display: none; padding: 0 10px; }
.roulette-wrapper.active { display: block !important; }
.roulette-container { width: 100%; height: 100%; background: #000; border-radius: 12px; position: relative; overflow: hidden; border: 2px solid var(--accent-red); box-shadow: 0 0 30px rgba(255,51,51,0.3); }
.roulette-strip { display: flex; position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
.roulette-item { flex-shrink: 0; width: 120px; height: 120px; margin: 10px 5px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #333; background: #111; position: relative; }
.roulette-item img { width: 70%; height: 70%; object-fit: contain; }
.roulette-item .name { font-size: 10px; color: #ccc; margin-top: 4px; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
.roulette-pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--accent-red); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px var(--accent-red); }
.flash-overlay { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 99; transition: opacity 0.2s; }
.flash-overlay.active { opacity: 1; }

/* Инвентарь */
.inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.inv-title { font-size: 16px; color: var(--accent-white); }
.inventory { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
.nft-card { aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; position: relative; background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px; }
.nft-card:active { transform: scale(0.95); }
.nft-card img { width: 70%; height: 70%; object-fit: contain; margin-bottom: 4px; }
.nft-card .name { font-size: 9px; padding: 0 2px; line-height: 1.1; color: #ccc; }
.nft-card .price { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); font-size: 9px; padding: 4px; color: var(--accent-red); border-top: 1px solid #222; }

/* Рамки редкостей */
.rarity-common { border-color: #333; }
.rarity-uncommon { border-color: #22c55e; }
.rarity-rare { border-color: #3b82f6; }
.rarity-epic { border-color: #a855f7; }
.rarity-legendary { border-color: #f59e0b; }
.rarity-mythic { border-color: var(--accent-red); box-shadow: 0 0 10px rgba(255,51,51,0.3); }

/* НОВЫЙ АПГРЕЙД */
.upgrade-grid { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 10px; align-items: center; margin-top: 10px; }
.upgrade-slot-box {
  background: #111; border: 2px dashed #333; border-radius: 16px;
  height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; text-align: center; padding: 8px;
}
.upgrade-slot-box.filled { border-style: solid; border-color: var(--accent-red); }
.upgrade-slot-box img { max-width: 70%; max-height: 70%; object-fit: contain; margin-bottom: 4px; }
.upgrade-slot-box .u-name { font-size: 10px; color: #fff; }
.upgrade-slot-box .u-price { font-size: 10px; color: var(--accent-red); margin-top: 4px; }

.upgrade-center {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.upgrade-circle {
  width: 80px; height: 80px; border-radius: 50%; background: #000;
  border: 3px solid #333; display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: bold; color: var(--accent-white);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8); transition: all 0.3s;
  position: relative; overflow: hidden;
}
.upgrade-circle.rolling { animation: spinGlow 0.3s infinite alternate; }
@keyframes spinGlow { 0% { border-color: #333; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); } 100% { border-color: var(--accent-red); box-shadow: inset 0 0 30px rgba(255,51,51,0.5); } }

.upgrade-arrow { font-size: 20px; color: #333; margin: 5px 0; }

.btn-upgrade-action { width: 100%; padding: 12px; background: var(--accent-red); color: #fff; border: none; border-radius: 12px; font-weight: bold; margin-top: 20px; text-transform: uppercase; cursor: pointer; }
.btn-upgrade-action:disabled { opacity: 0.5; filter: grayscale(1); }

/* Навигация (SVG) */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0a; border-top: 1px solid var(--border-color);
  display: flex; justify-content: space-around; padding: 12px 0; z-index: 50;
}
.nav-btn { background: none; border: none; color: #666; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 20%; transition: color 0.2s; }
.nav-btn svg { width: 22px; height: 22px; fill: #666; transition: fill 0.2s; }
.nav-btn.active { color: var(--accent-red); }
.nav-btn.active svg { fill: var(--accent-red); }

.tab-content { display: none; animation: fadeIn 0.3s; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Модалки */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal.hidden { display: none; }
.modal-card { background: var(--card-bg); border-radius: 16px; padding: 24px; text-align: center; max-width: 340px; width: 100%; border: 1px solid var(--border-color); animation: pop 0.3s; position: relative; max-height: 80vh; overflow-y: auto; }
@keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.modal-card h3 { margin-bottom: 8px; color: var(--accent-red); }
.modal-card p { color: var(--text-grey); margin-bottom: 24px; font-size: 12px; }

/* Список шансов */
.chance-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; text-align: left; }
.chance-item { display: flex; align-items: center; gap: 10px; background: #000; padding: 8px; border-radius: 8px; border: 1px solid #222; }
.chance-item img { width: 30px; height: 30px; object-fit: contain; margin: 0; }
.chance-item .info { flex-grow: 1; }
.chance-item .name { font-size: 12px; color: #fff; }
.chance-item .percent { font-size: 12px; color: #22c55e; font-weight: bold; }

/* Профиль */
.profile-card { background: var(--card-bg); border-radius: 16px; padding: 24px; text-align: center; border: 1px solid var(--border-color); margin-bottom: 20px; }
.avatar { width: 80px; height: 80px; border-radius: 50%; background: #000; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--accent-red); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.p-stat { background: #000; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
.p-stat .val { font-size: 20px; color: var(--accent-white); }
.p-stat .lbl { font-size: 10px; color: var(--text-grey); margin-top: 4px; }
.btn-ghost { background: transparent; border: 1px solid var(--border-color); color: var(--text-grey); padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; font-size: 14px; }

/* Лидерборд */
.lb-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border-color); }
.lb-row.me { border-color: var(--accent-red); background: rgba(255,51,51,0.05); }
.lb-rank { font-size: 16px; font-weight: bold; width: 30px; color: var(--accent-red); }
.lb-name { flex-grow: 1; font-size: 14px; }
.lb-val { font-size: 14px; color: var(--accent-white); }

#toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { background: #111; border: 1px solid var(--accent-red); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); animation: slideDown 0.3s ease-out; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

  <div id="splash-screen">
    <div class="splash-title">NFT BATTLE</div>
    <div class="splash-credits">Игру делали:<br><span>@apewok</span> и <span>@kalyganov</span></div>
  </div>

  <div id="toast-container"></div>
  <div class="flash-overlay" id="flashOverlay"></div>

  <div class="app">
    <header class="topbar">
      <h1>NFT BATTLE</h1>
      <div class="stats">
        <div class="stat">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          <span id="stars">5000</span>
        </div>
        <div class="stat">
          <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
          <span id="count">0</span>
        </div>
      </div>
    </header>

    <section id="tab-game" class="tab-content active">
      <div class="section-header">
        <div class="section-title">КЕЙСЫ</div>
        <button class="btn-mini btn-primary" id="dailyBonus">БОНУС</button>
      </div>
      <div class="cases-grid" id="casesGrid"></div>
    </section>

    <section id="tab-inventory" class="tab-content">
      <div class="inv-header">
        <div class="inv-title">ИНВЕНТАРЬ</div>
        <button class="btn-mini btn-red" id="sellAllBtn">Продать всё</button>
      </div>
      <div id="inventory" class="inventory"></div>
      <p id="emptyInv" class="empty" style="text-align:center; color:var(--text-grey); margin-top:30px;">Пусто. Открой кейс!</p>
    </section>

    <!-- НОВЫЙ АПГРЕЙД -->
    <section id="tab-upgrade" class="tab-content">
      <div class="upgrade-area" style="background: var(--card-bg); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid var(--border-color);">
        <h3 style="color:var(--accent-white);">АПГРЕЙД</h3>
        
        <div class="upgrade-grid">
          <!-- Твой предмет -->
          <div class="upgrade-slot-box" id="upLeftSlot" onclick="selectUpgradeItem('left')">
            <span style="color:#666;">Выбрать</span>
          </div>
          
          <!-- Центр -->
          <div class="upgrade-center">
            <div class="upgrade-circle" id="upCircle">0%</div>
            <div class="upgrade-arrow">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="#333"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </div>
          </div>

          <!-- Целевой предмет -->
          <div class="upgrade-slot-box" id="upRightSlot" onclick="selectUpgradeItem('right')">
            <span style="color:#666;">Выбрать</span>
          </div>
        </div>

        <button id="upgradeBtn" class="btn-upgrade-action" disabled>Апгрейд</button>
      </div>
    </section>

    <section id="tab-leaderboard" class="tab-content">
      <h2 style="font-size:16px; color:var(--accent-white); margin-bottom:12px; text-align:center;">ТОП ИГРОКОВ</h2>
      <div id="leaderboardList"></div>
    </section>

    <section id="tab-profile" class="tab-content">
      <div class="profile-card">
        <div class="avatar" id="userAvatar">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="#666"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <h2 id="userName" style="color:var(--accent-white);">Игрок</h2>
        <p style="color:var(--text-grey); font-size:12px; margin-top:4px;">ID: <span id="userId">#888888</span></p>
        <div class="profile-stats">
          <div class="p-stat"><div class="val" id="p-total">0</div><div class="lbl">ВСЕГО NFT</div></div>
          <div class="p-stat"><div class="val" id="p-value">0</div><div class="lbl">ЦЕННОСТЬ</div></div>
        </div>
      </div>
      <button class="btn-ghost" onclick="promptPromo()" style="color:var(--accent-white); border-color:var(--accent-white); margin-bottom:10px;">Ввести промокод</button>
      <button id="reset" class="btn-ghost">Сбросить прогресс</button>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="game">
      <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
      Кейсы
    </button>
    <button class="nav-btn" data-tab="inventory">
      <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
      Инвентарь
    </button>
    <button class="nav-btn" data-tab="upgrade">
      <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.59-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
      Апгрейд

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function playSound(type) {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if (type === 'click') {
    osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'drop') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'spin') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'win') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  } else if (type === 'lose') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

function showChances(caseId) {

  const total = Object.values(c.pool).reduce((a, b) => a + b, 0);
  chanceTitle.textContent = 'Шансы: ' + c.name;
  chanceList.innerHTML = '';
  const sorted = Object.entries(c.pool).sort((a, b) => ITEMS[b[0]].price - ITEMS[a[0]].price);
  sorted.forEach(([key, val]) => {
    const item = ITEMS[key];
    const percent = (val / total) * 100;
    const div = document.createElement('div');
    div.className = 'chance-item';
    div.innerHTML = `<img src="${item.img}" onerror="this.src='https://placehold.co/30x30/111/fff?text=?'"><div class="info"><div class="name">${item.name}</div><div class="percent">${percent.toFixed(1)}%</div></div><div style="font-size:12px; color:var(--accent-red);">${item.price} ⭐</div>`;

  });

}

  countEl.textContent = state.inventory.length;
  inventoryEl.innerHTML = '';
  if (state.inventory.length === 0) { emptyInv.style.display = 'block'; }
  else {
    emptyInv.style.display = 'none';
    state.inventory.forEach(item => {
      const card = nftCardEl(item);
      card.addEventListener('click', () => sellNFT(item.id));
      inventoryEl.appendChild(card);
    });
  }
  $('p-total').textContent = state.inventory.length;
  const totalVal = state.inventory.reduce((sum, n) => sum + n.price, 0);
  $('p-value').textContent = totalVal;
  renderCases();
  renderLeaderboard();
  updateShopUI();
}

function sellNFT(id) {
  const idx = state.inventory.findIndex(n => n.id === id);
  if (idx === -1) return;
  const item = state.inventory[idx];
  if (!confirm(`Продать ${item.name} за ${item.price} ⭐?`)) return;
  state.inventory.splice(idx, 1); state.stars += item.price;
  toast(`+${item.price} ⭐ за ${item.name}`);
  playSound('click'); save(); render();
}

$('sellAllBtn').addEventListener('click', () => {
  if (state.inventory.length === 0) return toast('Инвентарь пуст');
  if (!confirm('Продать ВСЕ NFT?')) return;
  let total = 0;
  state.inventory.forEach(item => total += item.price);
  state.stars += total; state.inventory = [];
  toast(`Продано всё на ${total} ⭐`);
  playSound('win'); save(); render();
});

$('dailyBonus').addEventListener('click', () => {
  const now = Date.now();
  const cooldown = 24 * 60 * 60 * 1000;
  if (now - state.lastBonus < cooldown) {
    const left = Math.ceil((cooldown - (now - state.lastBonus)) / (1000*60*60));
    return toast(`Бонус через ${left} ч.`);
  }
  state.lastBonus = now; state.stars += 500;
  toast('Бонус: +500 ⭐');
  playSound('win'); save(); render();
});

shopMultiBtns.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-multi-btn')) {
    playSound('click');
    state.shopCount = parseInt(e.target.dataset.count);
    updateShopUI();
  }
});

shopBuyBtn.addEventListener('click', () => {
  if (!activeShopCase) return;
  shopModal.classList.add('hidden');
  openCase(activeShopCase, state.shopCount);
});

function getRandomItem(pool) {
  const total = Object.values(pool).reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;
  for (const [key, chance] of Object.entries(pool)) {
    if (roll < chance) return { ...ITEMS[key], id: state.nextId++ };
    roll -= chance;
  }
  const keys = Object.keys(pool);
  return { ...ITEMS[keys[0]], id: state.nextId++ };
}

function openCase(activeCase, count) {
  const totalCost = activeCase.price * count;
  if (opening || state.stars < totalCost) return;
  
  opening = true;
  state.stars -= totalCost;
  
  openAnimArea.classList.add('active');
  animCaseImg.src = activeCase.img;
  playSound('drop');
  
  setTimeout(() => {
    openAnimArea.classList.remove('active');
    rouletteWrapper.classList.add('active');
    
    const winItems = [];
    for (let i = 0; i < count; i++) {
      winItems.push(getRandomItem(activeCase.pool));
    }

    const stripItems = [];
    for (let i = 0; i < 30; i++) {
      stripItems.push(getRandomItem(activeCase.pool));
    }
    const winIndex = 25;
    stripItems[winIndex] = winItems[0];

    rouletteStrip.innerHTML = '';
    stripItems.forEach(item => {
      const el = document.createElement('div');
      el.className = 'roulette-item rarity-' + item.rarity;
      el.innerHTML = `<img src="${item.img}" onerror="this.src='https://placehold.co/100x100/111/fff?text=?'"><div class="name">${item.name}</div>`;
      rouletteStrip.appendChild(el);
    });

    rouletteStrip.style.transition = 'none';
    rouletteStrip.style.transform = `translateX(0px)`;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const containerWidth = document.querySelector('.roulette-container').clientWidth;
        const itemWidth = 130;
        const targetX = -(winIndex * itemWidth + itemWidth / 2 - containerWidth / 2);
        
        rouletteStrip.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
        rouletteStrip.style.transform = `translateX(${targetX}px)`;
        
        let spinCount = 0;
        const spinInterval = setInterval(() => {
          playSound('spin');
          spinCount++;
          if (spinCount > 20) clearInterval(spinInterval);
        }, 200);
      });
    });

    setTimeout(() => {
      winItems.forEach(item => state.inventory.push(item));
      save(); render();

      flashOverlay.classList.add('active');
      setTimeout(() => flashOverlay.classList.remove('active'), 200);

      rouletteWrapper.classList.remove('active');
      rouletteStrip.style.transition = 'none';
      
      modalResults.innerHTML = '';
      winItems.forEach(item => modalResults.appendChild(nftCardEl(item, false)));
      modal.classList.remove('hidden');
      $('modalText').textContent = `Выпало: ${winItems.length} NFT`;
      
      playSound('win');
      opening = false;
      render();
    }, 4200);
  }, 1200);
}

modalClose.addEventListener('click', () => modal.classList.add('hidden'));

// ================= НОВЫЙ АПГРЕЙД =================
let upLeftItem = null;
let upRightItem = null;
let isUpgrading = false;

function updateUpgradeUI() {
  const leftSlot = $('upLeftSlot');
  const rightSlot = $('upRightSlot');
  const circle = $('upCircle');
  const btn = $('upgradeBtn');

  if (upLeftItem) {
    leftSlot.classList.add('filled');
    leftSlot.innerHTML = `<img src="${upLeftItem.img}"><div class="u-name">${upLeftItem.name}</div><div class="u-price">${upLeftItem.price} ⭐</div>`;
  } else {
    leftSlot.classList.remove('filled');
    leftSlot.innerHTML = `<span style="color:#666;">Выбрать</span>`;
  }

  if (upRightItem) {
    rightSlot.classList.add('filled');
    rightSlot.innerHTML = `<img src="${upRightItem.img}"><div class="u-name">${upRightItem.name}</div><div class="u-price">${upRightItem.price} ⭐</div>`;
  } else {
    rightSlot.classList.remove('filled');
    rightSlot.innerHTML = `<span style="color:#666;">Выбрать</span>`;
  }

  if (upLeftItem && upRightItem) {
    const chance = Math.floor((upLeftItem.price / upRightItem.price) * 100);
    circle.textContent = Math.min(100, chance) + '%';
    btn.disabled = false;
  } else {
    circle.textContent = '0%';
    btn.disabled = true;
  }
}

function selectUpgradeItem(side) {
  if (isUpgrading) return;
  playSound('click');

  const listContainer = document.createElement('div');
  listContainer.style = "position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; padding:20px; overflow-y:auto; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-content:flex-start;";
  
  const title = document.createElement('h3'); 
  title.textContent = side === 'left' ? "Твой предмет" : "На что меняем?"; 
  title.style = "width:100%; text-align:center; margin-bottom:10px; color:var(--accent-red);";
  listContainer.appendChild(title);

  const closeBtn = document.createElement('button'); 
  closeBtn.textContent = "Отмена"; 
  closeBtn.className = "btn-ghost"; 
  closeBtn.style = "width:100%; margin-top:20px;";
  closeBtn.onclick = () => document.body.removeChild(listContainer);

  let candidates = state.inventory;
  if (side === 'left' && upRightItem) {
    candidates = candidates.filter(n => n.price < upRightItem.price);
  } else if (side === 'right' && upLeftItem) {
    candidates = candidates.filter(n => n.price > upLeftItem.price);
  } else if (side === 'right' && !upLeftItem) {
    candidates = candidates.filter(n => n.price > 100);
  }

  if (candidates.length === 0) {
    alert('Нет подходящих предметов для этого слота.');
    return;
  }

  candidates.forEach(n => {
    const card = nftCardEl(n, false);
    card.style = "width:80px; height:80px; flex-shrink:0;";
    card.onclick = () => {
      if (side === 'left') upLeftItem = n;
      else upRightItem = n;
      updateUpgradeUI();
      document.body.removeChild(listContainer);
    };
    listContainer.appendChild(card);
  });
  
  listContainer.appendChild(closeBtn);
  document.body.appendChild(listContainer);
}

$('upgradeBtn').addEventListener('click', () => {
  if (!upLeftItem || !upRightItem || isUpgrading) return;
  isUpgrading = true;
  const btn = $('upgradeBtn');
  const circle = $('upCircle');
  btn.disabled = true;
  circle.classList.add('rolling');
  
  const chance = Math.min(100, Math.floor((upLeftItem.price / upRightItem.price) * 100));
  const isWin = Math.random() * 100 < chance;
  
  let ticks = 0;
  const rollInterval = setInterval(() => {
    circle.textContent = Math.floor(Math.random() * 100) + '%';
    if (ticks % 3 === 0) playSound('spin');
    ticks++;
  }, 50);

  setTimeout(() => {
    clearInterval(rollInterval);
    circle.classList.remove('rolling');
    
    if (isWin) {
      playSound('win');
      circle.textContent = 'УСПЕХ';
      circle.style.color = '#22c55e';
      circle.style.borderColor = '#22c55e';
      
      // Удаляем левый предмет и добавляем правый
      state.inventory = state.inventory.filter(i => i.id !== upLeftItem.id);
      const newItem = { ...upRightItem, id: state.nextId++ };
      state.inventory.push(newItem);
      upLeftItem = null;
      upRightItem = null;
      
      setTimeout(() => {
        alert(`УСПЕХ! Ты получил ${newItem.name}`);
        circle.textContent = '0%';
        circle.style.color = 'var(--accent-white)';
        circle.style.borderColor = '#333';
        isUpgrading = false;
        save(); render(); updateUpgradeUI();
      }, 800);
      
    } else {
      playSound('lose');
      circle.textContent = 'ПРОВАЛ';
      circle.style.color = 'var(--accent-red)';
      circle.style.borderColor = 'var(--accent-red)';
      
      // Удаляем левый предмет
      state.inventory = state.inventory.filter(i => i.id !== upLeftItem.id);
      upLeftItem = null;
      
      setTimeout(() => {
        alert(`ПРОВАЛ! Твой предмет сгорел.`);
        circle.textContent = '0%';
        circle.style.color = 'var(--accent-white)';
        circle.style.borderColor = '#333';
        isUpgrading = false;
        save(); render(); updateUpgradeUI();
      }, 800);
    }
  }, 3000);
});

function renderLeaderboard() {
  const list = $('leaderboardList');
  list.innerHTML = '';
  const myValue = state.inventory.reduce((sum, n) => sum + n.price, 0) + Math.floor(state.stars);
  const bots = [
    { name: 'CryptoKing', val: 25400 }, { name: 'NFT_Shark', val: 18850 }, { name: 'DogeMaster', val: 15200 },
    { name: 'PepeLord', val: 12150 }, { name: 'Whale22', val: 9400 }, { name: 'NoobKiller', val: 5200 }
  ];
  bots.push({ name: 'Вы', val: myValue, me: true });
  bots.sort((a, b) => b.val - a.val);
  bots.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row' + (b.me ? ' me' : '');
    row.innerHTML = `<div class="lb-rank">${i+1}</div><div class="lb-name">${b.name}</div><div class="lb-val">${b.val} ⭐</div>`;
    list.appendChild(row);
  });
}

document.querySelectorAll('.nav-btn').forEach(tab => {
  tab.addEventListener('click', () => {
    playSound('click');
    document.querySelectorAll('.nav-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    $('tab-' + tab.dataset.tab).classList.add('active');
  });
});

resetBtn.addEventListener('click', () => {
  if (!confirm('Точно сбросить ВЕСЬ прогресс?')) return;
  state = { stars: 5000, inventory: [], nextId: 1, lastBonus: 0, usedPromos: [], shopCount: 1 };
  upLeftItem = null; upRightItem = null; isUpgrading = false;
  save(); render(); updateUpgradeUI();
});

render();
updateUpgradeUI();
</script>
</body>
